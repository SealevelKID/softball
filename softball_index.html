<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新北市慢壘賽程表</title>
    <!-- 共用同一套樣式表 -->
    <link rel="stylesheet" href="softball_style.css">
    <style>
        /* 首頁專屬的區域選擇卡片樣式 */
        .region-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .region-card {
            background: white;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #2c3e50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 2px solid #e0e6ed;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .region-card:hover {
            border-color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.2);
        }

        .region-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .region-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }

        .header-title {
            text-align: center;
            color: #2c3e50;
            margin-top: 40px;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
    </style>
</head>

<body>
    <div id="app-container">
        <h1 class="header-title">⚾ 新北市慢壘賽程表</h1>
        <p style="text-align: center; color: #7f8c8d; font-size: 1.1rem;">請選擇您要查看的賽事區域</p>

        <!-- 區域選擇入口 -->
        <div class="region-grid">
            <!-- 三重區入口 -->
            <a href="sanchong_index.html" class="region-card">
                <div class="region-icon">🏟️</div>
                <h3 class="region-title">三重區</h3>
                <p style="color: #7f8c8d; margin-top: 10px;">115年秋季聯賽</p>
            </a>

            <!-- 樹林區入口 -->
            <a href="shulin_index.html" class="region-card">
                <div class="region-icon">⚾</div>
                <h3 class="region-title">樹林區</h3>
                <p style="color: #7f8c8d; margin-top: 10px;">115年秋季聯賽</p>
            </a>

            <!-- 五股區入口 -->
            <a href="wugu_index.html" class="region-card">
                <div class="region-icon">🥎</div>
                <h3 class="region-title">五股區</h3>
                <p style="color: #7f8c8d; margin-top: 10px;">115年秋季聯賽</p>
            </a>

            <!-- 新莊區入口 -->
            <a href="xinzhuang_index.html" class="region-card">
                <div class="region-icon">🏆</div>
                <h3 class="region-title">新莊區</h3>
                <p style="color: #7f8c8d; margin-top: 10px;">115年秋季聯賽</p>
            </a>
        </div>

        <!-- 頁尾 -->
        <div class="site-footer">
            ⚠️ 網頁資料由 AI 協助判讀，僅供參考。<br>
            系統提供下載圖片、隊伍搜尋與數據統計功能。
        </div>
    </div>
</body>

</html>
